<!DOCTYPE html>
<html lang="en" ng-app="TrendyStealsApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendy Steals - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #fff0f5;
        }
        header {
            background: url('https://th.bing.com/th/id/OIP.GYuF8hoSzY6GnKKczE-hPgHaE8?w=305&h=204&c=7&r=0&o=5&dpr=1.3&pid=1.7') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 2rem;
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #ffb6c1;
            padding: 1rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            font-size: 1.2rem;
            font-weight: bold;
        }
        nav a:hover {
            background-color: #ff69b4;
            border-radius: 5px;
        }
        .contact-section {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .contact-section h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .contact-section input, .contact-section textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .contact-section button {
            width: 100%;
            padding: 12px;
            background-color: #ff69b4;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .contact-section button:hover {
            background-color: #d14794;
        }
        footer {
            background-color: #ff69b4;
            color: white;
            text-align: center;
            padding: 1.5rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Trendy Steals</h1>
    </header>
    <nav>
        <a href="project.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="categories1.html">Categories</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
        <a href="#" onclick="showLogin()">Login</a>
    </nav>

    <div class="contact-section">
        <h2>We'd love to hear from you!</h2>
        <form ng-submit="submitContactForm()">
            <input type="text" placeholder="Your Name" ng-model="contact.name" required>
            <input type="email" placeholder="Your Email" ng-model="contact.email" required>
            <textarea rows="5" placeholder="Your Message" ng-model="contact.message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        <h2>Your One-Stop Solution</h2>
        <p>Providing the best services for you.</p>
        <p>&copy; 2025 Trendy Steals. All Rights Reserved.</p>
    </footer>

    <script>
        var app = angular.module('TrendyStealsApp', []);
        app.controller('MainController', function($scope) {
            $scope.contact = {};
            $scope.submitContactForm = function() {
                alert("Thank you, " + $scope.contact.name + "! We'll get back to you soon.");
                $scope.contact = {};
            };
        });
    </script>
</body>
</html>
