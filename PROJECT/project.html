<!DOCTYPE html>
<html lang="en" ng-app="TrendyStealsApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendy Steals</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://cdn.shopify.com/s/files/1/0115/8319/3145/products/image_e96062da-b13f-46bb-868b-fef9c983e96b_2048x.jpg?v=1624322977') no-repeat center center/cover;
            background-size: cover;
        }
        header {
            background: url('https://th.bing.com/th/id/OIP.GYuF8hoSzY6GnKKczE-hPgHaE8?w=305&h=204&c=7&r=0&o=5&dpr=1.3&pid=1.7') no-repeat center center/cover;
            background-size: cover;
            color: white;
            text-align: center;
            padding: 1.5rem;
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #ffb6c1;
            padding: 0.7rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            font-size: 1.2rem;
            font-weight: bold;
        }
        nav a:hover {
            background-color: #ff69b4;
            border-radius: 5px;
        }
        .image-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px;
        }
        .image-container img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #e22d85;
            color: white;
        }
        .login-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }
        .login-modal input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .login-modal button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
        }
        .login-modal button:hover {
            background-color: #d14794;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body ng-controller="MainController">
    <header>
        <h1>Trendy Steals</h1>
    </header>
    <nav>
        <a href="shop.html">Shop</a>
        <a href="categories1.html">Categories</a>
        <a href="contact.html">Contact</a>
        <a href="#" onclick="showLogin()">Login</a>
        <a href="cart.html">Cart</a>

    </nav>
    <div class="image-container">
        <img src="https://th.bing.com/th/id/OIP.DOwTCwdQO4AyLFXQupnk3QHaHa?w=177&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="Image 1">
        <img src="https://th.bing.com/th/id/OIP.QEPb0LVYKxnQHZsf9VdNewAAAA?w=115&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="Image 2">
        <img src="https://th.bing.com/th/id/OIP.3AB9IMtSpVc699A_xhSSGAHaE_?w=264&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="Image 3">
    </div>
    <div class="overlay" id="overlay" onclick="hideLogin()"></div>
    <div class="login-modal" id="loginModal">
        <h2>Login</h2>
        <input type="text" placeholder="Username" ng-model="username">
        <input type="password" placeholder="Password" ng-model="password">
        <button ng-click="login()">Login</button>
        <p style="color: red;" ng-show="errorMessage">{{errorMessage}}</p>
    </div>
    <footer>
        <h2>Your One-Stop Solution</h2>
        <p>Providing the best services for you.</p>
        <p>&copy; 2025 Trendy Steals. All Rights Reserved.</p>
    </footer>
    <script>
        var app = angular.module('TrendyStealsApp', []);
        app.controller('MainController', function($scope) {
            $scope.login = function() {
                if ($scope.username === 'admin' && $scope.password === 'password123') {
                    alert('Login Successful!');
                    hideLogin();
                } else {
                    $scope.errorMessage = 'Invalid username or password';
                }
            };
        });
        function showLogin() {
            document.getElementById('loginModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function hideLogin() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
